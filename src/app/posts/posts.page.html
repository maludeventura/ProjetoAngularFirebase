<ion-header>
  <ion-toolbar>
    <ion-title>Posts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-input [(ngModel)]="newPost" placeholder="Escreva algo..."></ion-input>
    <ion-button expand="block" (click)="createPost()">Postar</ion-button>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let post of posts">
      <ion-label>
        <h2>{{ post.user?.name }}</h2>
        <p>{{ post.description }}</p>
        <small>{{ post.created_at | date:'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
