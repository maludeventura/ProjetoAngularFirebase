<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <img class="logo" src="assets/icon/chapeu.png" alt="Logo">
    </ion-buttons>

    <ion-title>Social Country</ion-title>

    <ion-buttons slot="end">
      <ng-container *ngIf="!isLoggedIn()">
        <ion-button class="buttonEntrar" routerLink="/login">Entrar</ion-button>
        <ion-button class="buttonRegistrar" routerLink="/cadastro">Registrar</ion-button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn()">
        <ion-button class="buttonPerfil" routerLink="/perfil" fill="clear">
          <ion-avatar class="icon-perfil">
            <img [src]="formatarUrl(user?.picture)" alt="Perfil" />
          </ion-avatar>
        </ion-button>
        <ion-button class="buttonSair" (click)="logout()">Sair</ion-button>
      </ng-container>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="posts-container">
    <h2>Posts Recentes</h2>

    <ng-container *ngIf="isLoggedIn()">
      <div class="new-post-preview" *ngIf="postImageBase64">
        <img [src]="postImageBase64" alt="Prévia da imagem" class="post-image" />
      </div>
      <ion-item>
        <ion-input placeholder="Escreva uma postagem..." [(ngModel)]="newPost"></ion-input>
        <ion-button class="buttonPost" (click)="addPost()">Postar</ion-button>
        <ion-button fill="clear" size="small" (click)="triggerFileInput()" class="camera-btn">
          <ion-icon name="camera"></ion-icon>
        </ion-button>
        <input type="file" accept="image/*" id="fileInput-post" style="display: none;"
          (change)="onFileSelected($event)" />
      </ion-item>
    </ng-container>

    <ion-list *ngIf="posts && posts.length; else noPosts" class="posts-list">
      <div *ngFor="let post of posts" class="mensagem">

        <ion-item>
          <ion-avatar slot="start" class="post-avatar">
            <img [src]="formatarUrl(post.user?.picture)" alt="Avatar do usuário" />
          </ion-avatar>


          <ion-label>
            <h3>{{ post.user?.name }}</h3>
            <ng-container *ngIf="post.picture">
              <img [src]="formatarUrl(post.picture)" alt="Imagem do post" class="post-image" />
            </ng-container>
            <p>{{ post.description }}</p>
            <small>{{ post.created_at | date:'short' }}</small>
          </ion-label>

          <ion-button *ngIf="post.user?.id !== currentUserId" fill="clear" size="small" slot="end" class="responder-btn"
            (click)="toggleReply(post.id)">
            Responder
          </ion-button>

          <ion-button *ngIf="post.user?.id === currentUserId" fill="clear" size="small" slot="end"
            (click)="deletePost(post.id)">
            <ion-icon name="trash"></ion-icon>
          </ion-button>


        </ion-item>

        <div *ngIf="replyInputs[post.id]" class="input-reply">
          <ion-item>
            <ion-input [(ngModel)]="replyTexts[post.id]" placeholder="Digite sua resposta..."></ion-input>
            <ion-button size="small" (click)="addReply(post)">Enviar</ion-button>
          </ion-item>
        </div>

        <ion-list *ngIf="post.replies?.length" class="replies-list">
          <ion-item *ngFor="let reply of post.replies" class="resposta">
            <ion-avatar slot="start" class="reply-avatar">
              <img [src]="formatarUrl(reply.user?.picture)" alt="Avatar da resposta" />
            </ion-avatar>
            <ion-label>
              <h4>{{ reply.user?.name }}</h4>
              <p>{{ reply.description }}</p>
              <small>{{ reply.created_at | date:'short' }}</small>
            </ion-label>
          </ion-item>
        </ion-list>

      </div>
    </ion-list>

    <ng-template #noPosts>
      <p>Nenhum post encontrado.</p>
    </ng-template>

  </div>
</ion-content>
