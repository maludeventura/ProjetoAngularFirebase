<ion-content [fullscreen]="true" class="login-content">
    <ion-header>
    <ion-toolbar>
      <ion-title>Login</ion-title>
        <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
      </ion-buttons>
  </ion-toolbar>
</ion-header>
  <div class="login-wrapper">
    <ion-card class="login-card">
      <ion-card-header>
        <div class="login-header">
          <img src="assets/icon/chapeu.png" class="login-logo">
          <ion-card-title>Bem-vindo de volta!</ion-card-title>
          <ion-card-subtitle>Acesse sua conta!</ion-card-subtitle>
        </div>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="full" class="login-item">
          <ion-label position="floating">E-mail</ion-label>
          <ion-input type="email" [(ngModel)]="usuario.email"></ion-input>
        </ion-item>

        <ion-item lines="full" class="login-item">
          <ion-label position="floating">Senha</ion-label>
          <ion-input type="password" [(ngModel)]="usuario.password"></ion-input>
        </ion-item>

        <div class="btn-group">
          <ion-button class="buttonLogin" expand="block" (click)="loginUsuario()">Login</ion-button>
        </div>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
