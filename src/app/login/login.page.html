<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <ion-card class="login-card">
      <ion-card-header>
        <div class="login-header">
          <img src="assets/icon/pato-icon.jpg" class="login-logo">
          <ion-card-title>Bem-vindo ao Social Duck</ion-card-title>
          <ion-card-subtitle>Acesse ou crie sua conta!</ion-card-subtitle>
        </div>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="full" class="login-item">
          <ion-label position="floating">Nome Completo</ion-label>
          <ion-input type="text" [(ngModel)]="usuario.name"></ion-input>
        </ion-item>

        <ion-item lines="full" class="login-item">
          <ion-label position="floating">E-mail</ion-label>
          <ion-input type="email" [(ngModel)]="usuario.email"></ion-input>
        </ion-item>

        <ion-item lines="full" class="login-item">
          <ion-label position="floating">Senha</ion-label>
          <ion-input type="password" [(ngModel)]="usuario.password"></ion-input>
        </ion-item>

        <ion-item lines="full" class="login-item">
          <ion-label position="floating">Confirmação de Senha</ion-label>
          <ion-input type="password" [(ngModel)]="usuario.password_confirmation"></ion-input>
        </ion-item>

        <div class="btn-group">
          <ion-button class="buttonRegistrar" expand="block" (click)="cadastrarUsuario()">Registrar-se</ion-button>
          <ion-button class="buttonLogin" expand="block" (click)="loginUsuario()">Login</ion-button>
        </div>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
