<ion-content [fullscreen]="true">
  <ion-row class="ion-justify-content-center">
    <ion-col size="6">
      <ion-item>
        <ion-input type="text" label="Nome Completo" [(ngModel)]="usuario.name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input type="text" label="E-mail" [(ngModel)]="usuario.email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input type="password" label="Senha" [(ngModel)]="usuario.password"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input type="password" label="Confirmação de Senha" [(ngModel)]="usuario.password_confirmation"></ion-input>
      </ion-item>

      <!-- Botão de cadastro -->
      <ion-item>
        <ion-button expand="block" (click)="cadastrarUsuario()">Registrar-se</ion-button>
      </ion-item>

      <!-- Botão de login -->
      <ion-item>
        <ion-button expand="block" color="success" (click)="loginUsuario()">Login</ion-button>
      </ion-item>
    </ion-col>
  </ion-row>
</ion-content>
